coverage:
  status:
    project:
      default:
        # app/src/ was excluded below until 2026-07-28; that hid ~38k
        # statements (most of the actual Flask app, CLI, and project
        # manager) from this target. Including it drops the honest
        # combined number from ~82% (src/ only) to ~64% overnight -- not a
        # regression, just no longer hidden. Target set below the current
        # combined baseline so CI doesn't fail on every push while app/src/
        # gets real test coverage; ratchet this up as that happens.
        target: 60%
        threshold: 2%     # allow some drop while app/src/ coverage is uneven
    patch:
      default:
        target: auto
        threshold: 5%     # new code in a PR needs ≥ this coverage

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: true   # only comment when coverage changes

ignore:
  - "app/static/**"
  - "app/templates/**"
  - "tests/**"
  - "scripts/**"
  - "docs/**"
  - "vendor/**"
  - "build/**"
