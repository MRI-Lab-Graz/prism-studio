    <!-- Asked when DataLad is switched on for a project that has no name and email yet -->
    <div class="modal fade" id="gitIdentityModal" tabindex="-1" aria-labelledby="gitIdentityModalTitle" aria-hidden="true">
        <div class="modal-dialog">
            <form class="modal-content" id="gitIdentityModalForm">
                <div class="modal-header">
                    <h2 class="modal-title h5" id="gitIdentityModalTitle">Who saves changes in this project?</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted">DataLad signs every saved change with a name and email. They are kept in this project only, so people sharing one computer login stay apart.</p>
                    <label class="form-label" for="gitIdentityModalName">Your name</label>
                    <input class="form-control mb-2" id="gitIdentityModalName" autocomplete="name" required>
                    <label class="form-label" for="gitIdentityModalEmail">Your email</label>
                    <input class="form-control" id="gitIdentityModalEmail" type="email" autocomplete="email" required>
                    <div class="small mt-2 text-danger" id="gitIdentityModalError" aria-live="polite"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save and continue</button>
                </div>
            </form>
        </div>
    </div>
