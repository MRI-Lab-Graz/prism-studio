name: CI Validation

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # bids2openminds (requirements-optional.txt) transitively depends on pybids's
  # large, loosely-pinned dependency tree (scipy/sqlalchemy/formulaic/...).
  # A fully-compatible set of wheels exists, but pip's resolver can wander into
  # an unsatisfiable sdist-only branch while backtracking through newly
  # published releases. --prefer-binary keeps it on the wheel-only solution.
  PIP_PREFER_BINARY: '1'

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Bot-generated modality proposals only add content under proposals/; they skip
  # the code-oriented jobs below (a job skipped by its own `if` counts as passing
  # for required checks). Anything else runs everything.
  scope:
    name: PR scope
    runs-on: ubuntu-latest
    outputs:
      content_only: ${{ steps.scope.outputs.content_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect modality-proposal PR
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            python3 scripts/ci/pr_scope.py "$HEAD_BRANCH" "origin/$BASE_BRANCH" HEAD | tee -a "$GITHUB_OUTPUT"
          else
            echo content_only=false >> "$GITHUB_OUTPUT"
          fi

  specification-lock:
    name: Vendored specification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the vendored specification against specification.lock.json
        run: python3 scripts/ci/check_specification_lock.py

  fast-pr-checks:
    name: Fast On-Demand Checks
    needs: scope
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      # The JavaScript unit tests (a few seconds). vitest needs Node 22.12 or newer.
      # Content-only modality proposals touch no code, so they skip this.
      - name: Set up Node
        if: needs.scope.outputs.content_only != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: JavaScript unit tests
        if: needs.scope.outputs.content_only != 'true'
        run: |
          npm ci
          npx vitest run

      # A bare proposal is not registered yet, so this stays red until the
      # maintainer's registration push (which is no longer content-only).
      - name: Modality proposal fixtures
        if: needs.scope.outputs.content_only == 'true'
        run: python -m pytest tests/test_modality_proposal_fixtures.py -q

      # The script's own main() looks for terms/ next to it (the specification repo's layout);
      # Studio's are in official/library/terms, so this runs its check() with that folder.
      # Back to the plain script once prism-specification gives it a --terms option.
      - name: Modality conventions (vendored specification script)
        run: python -m pytest tests/test_modality_build.py -q -k vendored_conventions

      - name: Fast repository verification
        run: |
          python tests/verify_repo.py --check git-status,entrypoints-smoke,import-boundaries,dual-tree-drift,modality-docs,library-uniqueness,unsafe-patterns,pytest-modularity,linting,ruff,ruff-security,mypy --no-fix

  # No pytest here: nightly.yml already runs the full suite every night.
  nightly-deep-checks:
    name: Nightly Deep Checks
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Install gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GITLEAKS_VERSION="$(curl -sSfL -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/gitleaks/gitleaks/releases/latest | \
            python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"].lstrip("v"))')"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Nightly repository verification
        run: |
          python tests/verify_repo.py --check git-status,entrypoints-smoke,bids-compat-smoke,path-hygiene,system-file-filtering,import-boundaries,dual-tree-drift,modality-docs,library-uniqueness,python-security,unsafe-patterns,ruff-security,secrets,secrets-history,actions-security,dependencies,pip-audit,linting,ruff,mypy,testing,todos,documentation --no-fix

  # One system on purpose: Windows and macOS run the full suite nightly (nightly.yml).
  cross-platform-tests:
    name: Pytest (${{ matrix.os }})
    needs: scope
    if: (github.event_name == 'push' || github.event_name == 'pull_request') && needs.scope.outputs.content_only != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.10"

      # GitHub Actions' default shell on windows-latest is PowerShell, not
      # bash. Force bash (available via the runner's bundled Git Bash) so
      # the same install/test commands behave identically across all three
      # OSes instead of silently diverging on Windows.
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      # The browser (Playwright) tests take most of the time and run in the nightly workflow
      # (nightly.yml, on every system); a pull request gets everything else.
      - name: Run tests with coverage
        shell: bash
        run: |
          pytest tests/ --ignore=tests/e2e --cov=src --cov=app/src --cov-report=xml --cov-report=term-missing -q

      - name: Upload coverage to Codecov
        # Pin to v5.5.0 commit to avoid transient tag-resolution/codeload issues.
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        continue-on-error: true
        with:
          files: coverage.xml
          fail_ci_if_error: false
          # main is a protected branch on Codecov, which rejects tokenless
          # uploads ("Token required because branch is protected") -- without
          # this, continue-on-error/fail_ci_if_error masked every upload
          # failing silently, so coverage data on codecov.io went stale.
          token: ${{ secrets.CODECOV_TOKEN }}

  docs-build:
    name: Docs Build
    needs: scope
    if: (github.event_name == 'push' || github.event_name == 'pull_request') && needs.scope.outputs.content_only != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.10"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r docs/requirements.txt

      - name: Build docs with warnings as errors
        run: |
          sphinx-build -b html docs docs/_build/html -W
