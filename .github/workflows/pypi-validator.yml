name: Publish prism-validator to PyPI

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths: &validator_paths
      - 'scripts/build_validator_wheel.py'
      - 'scripts/validator_manifest.txt'
      - 'requirements-validator.txt'
      - 'src/**'
      - 'app/prism.py'
      - 'app/src/**'
      - 'app/schemas/**'
  pull_request:
    paths: *validator_paths
  workflow_dispatch: {}

concurrency:
  group: pypi-validator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Install test tools
        run: pip install pytest setuptools wheel

      - name: Build wheel and test it in a clean venv
        run: python -m pytest tests/test_validator_wheel.py -q

      - name: Tag must match the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('src/__init__.py').read()).group(1))")
          test "v$version" = "${GITHUB_REF_NAME}"

      - name: Build wheel for upload
        run: python scripts/build_validator_wheel.py --out dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: prism-validator-wheel
          path: dist/*.whl

  publish:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI Trusted Publishing, no API token stored
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: prism-validator-wheel
          path: dist

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          # a re-pushed tag re-runs this job; PyPI never accepts the same file twice
          skip-existing: true
