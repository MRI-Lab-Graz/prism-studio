name: Publish prism-validator to PyPI

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths: &validator_paths
      - 'scripts/build_validator_wheel.py'
      - 'scripts/validator_manifest.txt'
      - 'requirements-validator.txt'
      - 'src/**'
      - 'app/prism.py'
      - 'app/src/**'
      - 'app/schemas/**'
  pull_request:
    paths: *validator_paths
  workflow_dispatch: {}

concurrency:
  group: pypi-validator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Tag must match the package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: python scripts/ci/check_tag_version.py "${GITHUB_REF_NAME}"

      - name: Install test tools
        run: pip install pytest setuptools wheel

      - name: Build wheel and test it in a clean venv
        run: python -m pytest tests/test_validator_wheel.py -q

      - name: Build wheel for upload
        run: python scripts/build_validator_wheel.py --out dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: prism-validator-wheel
          path: dist/*.whl

  publish:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI Trusted Publishing, no API token stored
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prism-validator-wheel
          path: dist

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          # a re-pushed tag re-runs this job; PyPI never accepts the same file twice
          skip-existing: true
