[tool.black]
line-length = 88
exclude = '''
/(\.venv|\.venv_intel|venv|build|dist|\.git|\.eggs|archive|prism\.egg-info|prism-studio\.egg-info|docs/_build)/
'''

[tool.coverage.run]
# No `source` here: `coverage xml` would name files relative to it, and src/ and app/src/
# share names (tests/test_coverage_report_paths.py). CI passes --cov=src --cov=app/src.
omit = [
    "tests/*",
    "scripts/*",
    "docs/*",
    ".venv/*",
    ".venv_intel/*",
    "src/maintenance/*",
    "src/bids_file_deleter.py",
    "src/runtime_dependencies.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
show_missing = true
